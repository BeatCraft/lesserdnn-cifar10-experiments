name: Validate sources and recorded results
on: [push, pull_request]
jobs:
  cpu-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU validation dependencies
        run: |
          python -m pip install numpy==2.0.2 scipy==1.13.1
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate initialization, schedules and all result tables
        run: python validate_release.py
      - name: Check the 80-job driver without training
        run: python additional_experiments/run_experiment.py --dry-run > /tmp/jobs.json
